function firstSingleNumber() {
  if (cntPA <= limit) {
    for (let i = 1; i <= cntPA; i++) {
      if (cntNum[PA[i]] == 1) {
        return(PA[i]);
        break;
      }
    }
    return(-1);
  } else
  {
    for (let i = cntPA - limit; i <= cntPA; i++) {
      if (cntNum[PA[i]] == 1) {
        return(PA[i]);
        break;
      }
    }
    return(-1);
  }
}

function setProgressBar(startprogressbarvalue,isPlaying) {
  progressbar.value = startprogressbarvalue;
  if (progressbar.value <= 40) {
     msgpercentage.style.color =  "black";
     progressbar.style.accentColor = "red";
    } else 
    if ((progressbar.value > 40) &&
       (progressbar.value < 60)) {
      msgpercentage.style.color =  "black";
      progressbar.style.accentColor = "gold";
    } else 
    {
       msgpercentage.style.color =  "white";
       progressbar.style.accentColor = "blue";
    };

 if (isPlaying) {
   msgpercentage.style.marginLeft = '190px';
   msgpercentage.textContent = startprogressbarvalue + '%';    
 } else
 { 
    msgpercentage.style.marginLeft = '140px';

       msgpercentage.textContent = ""; else 
       msgpercentage.textContent = startprogressbarvalue + '% till play start'; 
  }   
}
